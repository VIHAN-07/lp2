
<!DOCTYPE html>
<html>
<head>
<title>Event Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  background:#f8f9fa;
  padding-top:60px;
}
.box{
  max-width:600px;
  margin:auto;
  background:#fff;
  padding:25px;
  border-radius:8px;
  box-shadow:0 0 10px #ccc;
}
</style>
</head>

<body>

<div class="container">
  <div class="box">

    <h3 class="text-center mb-3">Event Registration Form</h3>

    <div id="successMsg" class="alert alert-success d-none text-center">
      Registration Successful!
    </div>

    <form id="form" novalidate>

      <div class="form-floating mb-3">
        <input class="form-control" type="text" placeholder="Name"
          pattern="[A-Za-z ]{3,}" required
          data-bs-toggle="tooltip" title="Only letters, min 3 characters">
        <label>Full Name</label>
        <div class="invalid-feedback">Enter valid name</div>
      </div>

      <div class="form-floating mb-3">
        <input class="form-control" type="email" placeholder="Email"
          required data-bs-toggle="tooltip"
          title="Enter valid email (abc@gmail.com)">
        <label>Email</label>
        <div class="invalid-feedback">Enter valid email</div>
      </div>

      <div class="form-floating mb-3">
        <input class="form-control" type="password" placeholder="Password"
          pattern=".{6,}" required
          data-bs-toggle="tooltip" title="Min 6 characters">
        <label>Password</label>
        <div class="invalid-feedback">Enter valid password</div>
      </div>

      <div class="form-floating mb-3">
        <input class="form-control" type="tel" placeholder="Phone"
          pattern="[0-9]{10}" required
          data-bs-toggle="tooltip" title="Enter 10 digit number">
        <label>Phone Number</label>
        <div class="invalid-feedback">Enter 10 digit number</div>
      </div>

      <div class="form-floating mb-3">
        <select class="form-select" required
          data-bs-toggle="tooltip" title="Select event type">
          <option value="">Choose</option>
          <option>Tech Talk</option>
          <option>Workshop</option>
          <option>Coding Competition</option>
        </select>
        <label>Event Type</label>
        <div class="invalid-feedback">Select event</div>
      </div>

      <button class="btn btn-primary w-100">Register</button>

    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.querySelectorAll('[data-bs-toggle="tooltip"]')
.forEach(e => new bootstrap.Tooltip(e));

document.getElementById("form").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;

  if (!f.checkValidity()) {
    f.classList.add("was-validated");
  } else {
    successMsg.classList.remove("d-none");
    f.reset();
    f.classList.remove("was-validated");
  }
});
</script>

</body>
</html>
