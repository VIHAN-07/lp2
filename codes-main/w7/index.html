<!DOCTYPE html>
<html>
<head>
    <title>Facebook</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #edf0f5; }
        .topbar { background: #3b5998; color: white; padding: 10px; }
        .logo { font-size: 28px; font-weight: bold; }
    </style>
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="container d-flex justify-content-between align-items-center">

        <div class="logo">facebook</div>

        <div class="d-flex">
            <input class="form-control form-control-sm me-2" placeholder="Email">
            <input class="form-control form-control-sm me-2" type="password" placeholder="Password">
            <button class="btn btn-light btn-sm">Login</button>
        </div>

    </div>
</div>

<!-- MAIN -->
<div class="container mt-5">
    <div class="row">

        <!-- LEFT -->
        <div class="col-md-6">
            <h4>Facebook is useless without friends.<br>Make More Friends.</h4>
            <p>Facebook helps you connect and share with the people in your life.</p>
            <img src="inception.png" class="img-fluid rounded">
        </div>

        <!-- RIGHT -->
        <div class="col-md-6">
            <h3>Create an Account</h3>
            <p>It’s free and always will be.</p>

            <form>
                <div class="row mb-2">
                    <div class="col">
                        <input class="form-control" placeholder="First name">
                    </div>
                    <div class="col">
                        <input class="form-control" placeholder="Last name">
                    </div>
                </div>

                <input class="form-control mb-2" placeholder="Email">
                <input class="form-control mb-2" placeholder="Re-enter email">
                <input class="form-control mb-2" type="password" placeholder="Password">
                <input class="form-control mb-2" placeholder="DOB">

                <div class="mb-2">
                    <input type="radio" name="g"> Male
                    <input type="radio" name="g" class="ms-3"> Female
                </div>

                <button class="btn btn-success">Sign Up</button>
            </form>
        </div>

    </div>
</div>

</body>
</html>
