<!DOCTYPE html>
<html>
<head>
  <title>ABC Delights</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <h1>🍽 ABC Delights</h1>
    <p>Restaurant Menu</p>
  </div>

  <!-- SECTIONS -->
  <div class="container">

    <div class="card">
      <h2>Welcome</h2>
      <p>Fresh ingredients, high quality food.</p>
      <p><i>Chef's Message: Cooking is my passion!</i></p>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Top Dishes</h2>
        <ol>
          <li>Paneer Tikka</li>
          <li>Biryani</li>
        </ol>
      </div>

      <div class="card">
        <h2>Cuisines</h2>
        <ul>
          <li>Indian</li>
          <li>Italian</li>
          <li>Chinese</li>
        </ul>
      </div>
    </div>

    <div class="card">
      <h2>Menu</h2>
      <table>
        <tr><th>Image</th><th>Dish</th><th>Price</th></tr>
        <tr>
          <td><img src="https://via.placeholder.com/60"></td>
          <td>Paneer Tikka</td>
          <td>₹250</td>
        </tr>
        <tr>
          <td><img src="https://via.placeholder.com/60"></td>
          <td>Biryani</td>
          <td>₹300</td>
        </tr>
      </table>
    </div>

  </div>

</body>
</html>
