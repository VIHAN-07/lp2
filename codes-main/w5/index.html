<!DOCTYPE html>
<html>
<head>
<title>E-Commerce</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f5f5f5}

.sidebar{background:#fff;padding:10px;border-radius:8px}
.card{border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
.small{font-size:12px;color:#666}

.top-bar{
  background:linear-gradient(90deg,#ff7e5f,#feb47b);
  border-radius:10px;
}
</style>

</head>

<body>

<div class="container mt-3">

<!-- TOP BAR -->
<div class="d-flex justify-content-between align-items-center p-3 mb-3 top-bar">
  <h5 class="text-white m-0">Mugs</h5>

  <select id="sort" class="form-select w-25" onchange="sortProducts()">
    <option value="">Sort</option>
    <option value="low">Low-High</option>
    <option value="high">High-Low</option>
  </select>
</div>

<div class="row">

<!-- SIDEBAR -->
<div class="col-md-3">
  <div class="sidebar">
    <b>Filters</b>

    <div><input type="checkbox" value="usa" onchange="filterProducts()"> USA</div>
    <div><input type="checkbox" value="canada" onchange="filterProducts()"> Canada</div>

    <hr>

    <div><input type="checkbox" value="front" onchange="filterProducts()"> Front</div>
    <div><input type="checkbox" value="wrap" onchange="filterProducts()"> Wrap</div>
  </div>
</div>

<!-- PRODUCTS -->
<div class="col-md-9">
  <div class="row" id="products">

    <!-- PRODUCTS LIST -->

    <div class="col-md-4 col-sm-6 mb-3 product" data-price="250" data-country="usa" data-type="front">
      <div class="card p-2">
        <img src="https://via.placeholder.com/150">
        <h6>Ceramic Mug</h6>
        <p class="small">₹250</p>
      </div>
    </div>

    <div class="col-md-4 col-sm-6 mb-3 product" data-price="300" data-country="canada" data-type="wrap">
      <div class="card p-2">
        <img src="https://via.placeholder.com/150">
        <h6>Accent Mug</h6>
        <p class="small">₹300</p>
      </div>
    </div>

    <div class="col-md-4 col-sm-6 mb-3 product" data-price="200" data-country="usa" data-type="front">
      <div class="card p-2">
        <img src="https://via.placeholder.com/150">
        <h6>White Mug</h6>
        <p class="small">₹200</p>
      </div>
    </div>

    <div class="col-md-4 col-sm-6 mb-3 product" data-price="220" data-country="canada" data-type="wrap">
      <div class="card p-2">
        <img src="https://via.placeholder.com/150">
        <h6>Black Mug</h6>
        <p class="small">₹220</p>
      </div>
    </div>

    <div class="col-md-4 col-sm-6 mb-3 product" data-price="260" data-country="usa" data-type="wrap">
      <div class="card p-2">
        <img src="https://via.placeholder.com/150">
        <h6>Color Mug</h6>
        <p class="small">₹260</p>
      </div>
    </div>

    <div class="col-md-4 col-sm-6 mb-3 product" data-price="350" data-country="canada" data-type="front">
      <div class="card p-2">
        <img src="https://via.placeholder.com/150">
        <h6>Travel Mug</h6>
        <p class="small">₹350</p>
      </div>
    </div>

    <!-- NEW MUGS -->

    <div class="col-md-4 col-sm-6 mb-3 product" data-price="280" data-country="usa" data-type="front">
      <div class="card p-2">
        <img src="https://via.placeholder.com/150">
        <h6>Printed Mug</h6>
        <p class="small">₹280</p>
      </div>
    </div>

    <div class="col-md-4 col-sm-6 mb-3 product" data-price="310" data-country="canada" data-type="wrap">
      <div class="card p-2">
        <img src="https://via.placeholder.com/150">
        <h6>Glossy Mug</h6>
        <p class="small">₹310</p>
      </div>
    </div>

    <div class="col-md-4 col-sm-6 mb-3 product" data-price="240" data-country="usa" data-type="wrap">
      <div class="card p-2">
        <img src="https://via.placeholder.com/150">
        <h6>Matte Mug</h6>
        <p class="small">₹240</p>
      </div>
    </div>

    <div class="col-md-4 col-sm-6 mb-3 product" data-price="330" data-country="canada" data-type="front">
      <div class="card p-2">
        <img src="https://via.placeholder.com/150">
        <h6>Steel Mug</h6>
        <p class="small">₹330</p>
      </div>
    </div>

  </div>
</div>

</div>
</div>

<script>

function sortProducts(){
  let type = document.getElementById("sort").value;
  let items = Array.from(document.getElementsByClassName("product"));
  let container = document.getElementById("products");

  items.sort((a,b)=>{
    let A = parseInt(a.getAttribute("data-price"));
    let B = parseInt(b.getAttribute("data-price"));
    return type=="low" ? A-B : B-A;
  });

  container.innerHTML="";
  items.forEach(i=>container.appendChild(i));
}

function filterProducts(){
  let checked = Array.from(document.querySelectorAll(".sidebar input:checked"))
                     .map(cb => cb.value);

  let items = document.querySelectorAll(".product");

  items.forEach(item => {
    let country = item.getAttribute("data-country");
    let type = item.getAttribute("data-type");

    if(checked.length === 0){
      item.style.display = "block";
    } else {
      if(checked.includes(country) || checked.includes(type)){
        item.style.display = "block";
      } else {
        item.style.display = "none";
      }
    }
  });
}

</script>

</body>
</html>
