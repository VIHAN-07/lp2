<!-- ADD TASK -->
<div class="box">
  <h2>To-Do List</h2>

  <div class="row">
    <input [(ngModel)]="newTask" placeholder="Enter task">
    <button (click)="add()">Add</button>
  </div>

  <!-- TASK LIST -->
  <ul>
    <li *ngFor="let task of tasks; let i = index">

      <!-- EDIT MODE -->
      <ng-container *ngIf="editIndex === i; else viewMode">
        <input [(ngModel)]="editText">
        <button (click)="saveEdit()">Save</button>
      </ng-container>

      <!-- VIEW MODE -->
      <ng-template #viewMode>
        {{ task }}
        <span>
          <button (click)="startEdit(i)">Edit</button>
          <button (click)="delete(i)">Delete</button>
        </span>
      </ng-template>

    </li>
  </ul>
</div>
