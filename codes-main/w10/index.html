<!DOCTYPE html>
<html>
<head>
  <title>To-Do App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #eef4ff; }
    .box { max-width: 500px; margin: 50px auto; padding: 20px; background: white; border-radius: 10px; }
  </style>
</head>
<body>

  <div class="box shadow text-center">
    <h4>To-Do List</h4>
    <input id="task" class="form-control mb-2" placeholder="Enter task">
    <button class="btn btn-primary w-100 mb-3" onclick="add()">Add</button>
    <ul id="list" class="list-group"></ul>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function save() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function show() {
      document.getElementById("list").innerHTML = tasks.map((t, i) => `
        <li class="list-group-item d-flex justify-content-between">
          ${t}
          <span>
            <button class="btn btn-warning btn-sm" onclick="edit(${i})">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="del(${i})">Del</button>
          </span>
        </li>`).join("");
    }

    // AJAX using XMLHttpRequest via Blob URL
    function ajaxRequest(data, callback) {
      const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
      const url  = URL.createObjectURL(blob);
      const xhr  = new XMLHttpRequest();
      xhr.open("GET", url, true);
      xhr.onload = function () {
        URL.revokeObjectURL(url);
        callback(JSON.parse(xhr.responseText));
      };
      xhr.send();
    }

    function add() {
      const val = document.getElementById("task").value.trim();
      if (!val) return;
      tasks.push(val);
      ajaxRequest(tasks, function (data) {
        tasks = data;
        document.getElementById("task").value = "";
        save();
        show();
      });
    }

    function edit(i) {
      const v = prompt("Edit task", tasks[i]);
      if (!v) return;
      tasks[i] = v;
      ajaxRequest(tasks, function (data) {
        tasks = data;
        save();
        show();
      });
    }

    function del(i) {
      tasks.splice(i, 1);
      ajaxRequest(tasks, function (data) {
        tasks = data;
        save();
        show();
      });
    }

    show();
  </script>

</body>
</html>
