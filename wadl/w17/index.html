<!DOCTYPE html>
<html>
<head>
  <title>Employee Directory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>👨‍💼 Employee Directory</h1>

<div id="employees" class="container"></div>

<script>
  fetch("/api/employees")
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById("employees");

      data.forEach(emp => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <img src="${emp.image}" />
          <h3>${emp.name}</h3>
          <p><b>${emp.designation}</b></p>
          <p>${emp.department}</p>
          <p>₹${emp.salary}</p>
        `;

        container.appendChild(card);
      });
    })
    .catch(err => console.log(err));
</script>

</body>
</html>
