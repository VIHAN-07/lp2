<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Facebook Clone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f0f2f5;
    }
    .fb-header {
      background-color: #3b5998;
      color: white;
      padding: 10px 0;
    }
    .signup-box input {
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="fb-header">
  <div class="container d-flex justify-content-between align-items-center flex-wrap">
    
    <h2 class="fw-bold">facebook</h2>

    <!-- Login Form -->
    <form class="d-flex flex-wrap gap-2">
      <input type="text" class="form-control form-control-sm" placeholder="Email or Username">
      <input type="password" class="form-control form-control-sm" placeholder="Password">
      <button class="btn btn-light btn-sm">Login</button>
    </form>

  </div>
</div>

<!-- ================= MAIN SECTION ================= -->
<div class="container mt-5">
  <div class="row">

    <!-- LEFT SIDE -->
    <div class="col-md-6 mb-4">
      <h4>Facebook is useless without friends.</h4>
      <h5>Make More Friends.</h5>

      <div class="mt-3">
        <img src="https://via.placeholder.com/400x250" class="img-fluid">
      </div>
    </div>

    <!-- RIGHT SIDE (SIGNUP) -->
    <div class="col-md-6">
      <h2>Create an Account</h2>
      <p>It's free and always will be.</p>

      <div class="signup-box">

        <div class="row">
          <div class="col">
            <input type="text" class="form-control" placeholder="Firstname">
          </div>
          <div class="col">
            <input type="text" class="form-control" placeholder="Lastname">
          </div>
        </div>

        <input type="email" class="form-control" placeholder="Email">
        <input type="email" class="form-control" placeholder="Re-enter email">
        <input type="password" class="form-control" placeholder="Password">

        <!-- DOB -->
        <input type="date" class="form-control">

        <!-- Gender -->
        <div class="mt-2">
          <input type="radio" name="gender"> Male
          <input type="radio" name="gender" class="ms-3"> Female
        </div>

        <!-- Signup Button -->
        <button class="btn btn-success mt-3">Sign Up</button>

        <p class="mt-2 small">
          By clicking create an account, you agree to our Terms.
        </p>

      </div>
    </div>

  </div>
</div>

</body>
</html>
