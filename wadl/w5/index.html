<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Mug Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <div class="container-fluid mt-3">
    <div class="row">


      <!-- ================= SIDEBAR FILTER ================= -->
      <div class="col-md-3 mb-3">
        <h5>Filters</h5>

        <h6>Target Market</h6>
        <div class="form-check">
          <input class="form-check-input filter-market" value="USA" type="checkbox"> USA
        </div>
        <div class="form-check">
          <input class="form-check-input filter-market" value="Europe" type="checkbox"> Europe
        </div>

        <h6 class="mt-3">Print Area</h6>
        <div class="form-check">
          <input class="form-check-input filter-area" value="Front" type="checkbox"> Front
        </div>
        <div class="form-check">
          <input class="form-check-input filter-area" value="Full" type="checkbox"> Full Wrap
        </div>

        <h6 class="mt-3">Print Providers</h6>
        <div class="form-check">
          <input class="form-check-input filter-provider" value="CustomCat" type="checkbox"> CustomCat
        </div>
      </div>

      <!-- ================= PRODUCT GRID ================= -->
      <div class="col-md-9">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3>Mugs</h3>
          <select id="sortSelect" class="form-select w-auto">
            <option value="default">Sort by Popularity</option>
            <option value="low">Price Low to High</option>
            <option value="high">Price High to Low</option>
          </select>
        </div>

        <div class="row" id="productContainer">

          <!-- PRODUCT -->
          <div class="col-md-4 col-sm-6 col-12 mb-4 product" data-market="USA" data-area="Front"
            data-provider="CustomCat" data-price="4.40">
            <div class="card h-100">
              <img src="https://via.placeholder.com/250" class="card-img-top">
              <div class="card-body">
                <h6>Ceramic Mug 11oz</h6>
                <p class="text-success">$4.40</p>
              </div>
            </div>
          </div>

          <div class="col-md-4 col-sm-6 col-12 mb-4 product" data-market="Europe" data-area="Full"
            data-provider="CustomCat" data-price="5.32">
            <div class="card h-100">
              <img src="https://via.placeholder.com/250" class="card-img-top">
              <div class="card-body">
                <h6>Accent Coffee Mug</h6>
                <p class="text-success">$5.32</p>
              </div>
            </div>
          </div>

          <div class="col-md-4 col-sm-6 col-12 mb-4 product" data-market="USA" data-area="Front"
            data-provider="CustomCat" data-price="3.85">
            <div class="card h-100">
              <img src="https://via.placeholder.com/250" class="card-img-top">
              <div class="card-body">
                <h6>White Mug</h6>
                <p class="text-success">$3.85</p>
              </div>
            </div>
          </div>

        </div>
      </div>


      <!-- FILTER + SORT JS -->

      <script>

        const products = document.querySelectorAll(".product");

        // FILTER FUNCTION
        function filterProducts() {
          const markets = [...document.querySelectorAll(".filter-market:checked")].map(e => e.value);
          const areas = [...document.querySelectorAll(".filter-area:checked")].map(e => e.value);
          const providers = [...document.querySelectorAll(".filter-provider:checked")].map(e => e.value);

          products.forEach(p => {
            const matchMarket = markets.length === 0 || markets.includes(p.dataset.market);
            const matchArea = areas.length === 0 || areas.includes(p.dataset.area);
            const matchProvider = providers.length === 0 || providers.includes(p.dataset.provider);

            if (matchMarket && matchArea && matchProvider) {
              p.style.display = "block";
            } else {
              p.style.display = "none";
            }
          });
        }

        // EVENT LISTENERS
        document.querySelectorAll("input[type=checkbox]").forEach(cb => {
          cb.addEventListener("change", filterProducts);
        });

        // SORT FUNCTION
        document.getElementById("sortSelect").addEventListener("change", function () {
          const container = document.getElementById("productContainer");
          const items = Array.from(document.querySelectorAll(".product"));

          if (this.value === "low") {
            items.sort((a, b) => a.dataset.price - b.dataset.price);
          } else if (this.value === "high") {
            items.sort((a, b) => b.dataset.price - a.dataset.price);
          }

          items.forEach(item => container.appendChild(item));
        });

      </script>




    </div>
  </div>

</body>

</html>
