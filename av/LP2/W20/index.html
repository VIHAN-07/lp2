<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        form { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; max-width: 400px; }
        input { margin-bottom: 10px; width: 90%; padding: 5px; }
        button { padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Employee Management System</h1>
    
    <h3>Add / Update Employee</h3>
    <form onsubmit="postData(event)" id="enterData">
        <input type="hidden" id="empId"> <!-- Hidden field to store ID during updates -->
        <input type="text" id="Name" placeholder="Name" required><br>
        <input type="text" id="Department" placeholder="Department" required><br>
        <input type="text" id="Designation" placeholder="Designation" required><br>
        <input type="number" id="Salary" min="0" placeholder="Salary" required><br>
        <input type="date" id="JoiningDate" required><br>
        <input type="submit" id="submitBtn" value="Add Employee">
    </form>

    <h3>Employee Records</h3>
    <table id="employees" border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Department</th>
                <th>Designation</th>
                <th>Salary</th>
                <th>Joining Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="employeeTableBody">
            <!-- Data will be populated here -->
        </tbody>
    </table>

    <script>
        // Load data when the page loads
        getAllData();

        async function postData(event) {
            event.preventDefault();
            
            const id = document.getElementById('empId').value;
            const data = {
                Name: document.getElementById('Name').value,
                Department: document.getElementById('Department').value,
                Designation: document.getElementById('Designation').value,
                Salary: document.getElementById('Salary').value,
                JoiningDate: document.getElementById('JoiningDate').value
            };

            try {
                let url = 'http://localhost:3000/addEmployee';
                let method = 'POST';

                // If an ID exists, we are updating instead of adding
                if (id) {
                    url = `http://localhost:3000/updateEmployee/${id}`;
                    method = 'PUT';
                }

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                await response.json();
                
                // Clear the form and reload the table
                document.getElementById('enterData').reset();
                document.getElementById('empId').value = '';
                document.getElementById('submitBtn').value = 'Add Employee';
                getAllData();

            } catch (err) {
                console.log(err);
            }
        }

        async function getAllData() {
            try {
                const response = await fetch('http://localhost:3000/getEmployees');
                if (!response.ok) {
                    throw new Error(response.status);
                }
                const employees = await response.json();
                print(employees);
            } catch (err) {
                console.log(err);
            }
        }

        function print(employees) {
            const tbody = document.getElementById("employeeTableBody");
            tbody.innerHTML = ''; // Clear existing rows

            employees.forEach(emp => {
                const tablerow = document.createElement('tr');
                
                // Formatting the date nicely
                const dateObj = new Date(emp.JoiningDate);
                const formattedDate = dateObj.toISOString().split('T')[0];

                tablerow.innerHTML = `
                    <td>${emp.Name}</td>
                    <td>${emp.Department}</td>
                    <td>${emp.Designation}</td>
                    <td>${emp.Salary}</td>
                    <td>${formattedDate}</td>
                    <td>
                        <button onclick="editEmployee('${emp._id}', '${emp.Name}', '${emp.Department}', '${emp.Designation}', '${emp.Salary}', '${formattedDate}')">Edit</button>
                        <button onclick="deleteEmployee('${emp._id}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tablerow);
            });
        }

        async function deleteEmployee(id) {
            if(confirm("Are you sure you want to delete this employee?")) {
                try {
                    const response = await fetch(`http://localhost:3000/deleteEmployee/${id}`, {
                        method: 'DELETE'
                    });
                    await response.json();
                    getAllData(); // Refresh the table
                } catch (err) {
                    console.log(err);
                }
            }
        }

        function editEmployee(id, name, dept, desig, salary, date) {
            // Populate the form with the employee's existing data
            document.getElementById('empId').value = id;
            document.getElementById('Name').value = name;
            document.getElementById('Department').value = dept;
            document.getElementById('Designation').value = desig;
            document.getElementById('Salary').value = salary;
            document.getElementById('JoiningDate').value = date;
            
            // Change button text to indicate an update
            document.getElementById('submitBtn').value = 'Update Employee';
            window.scrollTo(0,0);
        }
    </script>
</body>
</html>
