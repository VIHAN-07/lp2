<div class="container">
  <h1>📝 To-Do List</h1>

  <input [(ngModel)]="newTask" placeholder="Enter task">
  <button (click)="addTask()">Add</button>

  <ul>
    <li *ngFor="let task of tasks; let i = index">

      <span *ngIf="!task.editing">
        {{ task.name }}
      </span>

      <input *ngIf="task.editing" [(ngModel)]="task.name">

      <button *ngIf="!task.editing" (click)="editTask(i)">Edit</button>
      <button *ngIf="task.editing" (click)="saveTask(i)">Save</button>
      <button (click)="deleteTask(i)">Delete</button>

    </li>
  </ul>
</div>
