<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Bookstore Management</title>

</head>
<body>
    <h1>Bookstore Inventory</h1>
    
    <h3>Add / Update Book</h3>
    <form onsubmit="handleFormSubmit(event)" id="bookForm">
        <!-- Hidden field to track if we are updating an existing book -->
        <input type="hidden" id="bookId"> 
        
        <label for="Title">Book Title:</label>
        <input type="text" id="Title" placeholder="e.g., The Great Gatsby" required><br>
        
        <label for="Author">Author:</label>
        <input type="text" id="Author" placeholder="e.g., F. Scott Fitzgerald" required><br>
        
        <label for="Price">Price ($):</label>
        <input type="number" id="Price" min="0" step="0.01" placeholder="e.g., 10.99" required><br>
        
        <label for="Genre">Genre:</label>
        <input type="text" id="Genre" placeholder="e.g., Classic" required><br>
        
        <input type="submit" id="submitBtn" class="submit-btn" value="Add New Book">
    </form>

    <h3>Current Books</h3>
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
                <th>Genre</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="bookTableBody">
            <!-- Books will be injected here via JavaScript -->
        </tbody>
    </table>

    <script>
        // Fetch all books as soon as the page loads
        fetchBooks();

        // Handle Add and Update logic
        async function handleFormSubmit(event) {
            event.preventDefault();
            
            const id = document.getElementById('bookId').value;
            const bookData = {
                Title: document.getElementById('Title').value,
                Author: document.getElementById('Author').value,
                Price: document.getElementById('Price').value,
                Genre: document.getElementById('Genre').value
            };

            try {
                let url = 'http://localhost:3000/addBook';
                let method = 'POST';

                // If a bookId exists in the hidden field, it's an update operation
                if (id) {
                    url = `http://localhost:3000/updateBook/${id}`;
                    method = 'PUT';
                }

                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookData)
                });
                
                await response.json();
                
                // Reset form and UI states
                document.getElementById('bookForm').reset();
                document.getElementById('bookId').value = '';
                document.getElementById('submitBtn').value = 'Add New Book';
                
                // Refresh the table
                fetchBooks();

            } catch (err) {
                console.error("Error saving book:", err);
            }
        }

        // Retrieve all books from the server
        async function fetchBooks() {
            try {
                const response = await fetch('http://localhost:3000/getBooks');
                if (!response.ok) throw new Error("Failed to fetch");
                const books = await response.json();
                renderTable(books);
            } catch (err) {
                console.error(err);
            }
        }

        // Display books in the HTML table
        function renderTable(books) {
            const tbody = document.getElementById("bookTableBody");
            tbody.innerHTML = ''; // Clear table before re-rendering

            books.forEach(book => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${book.Title}</td>
                    <td>${book.Author}</td>
                    <td>$${book.Price.toFixed(2)}</td>
                    <td>${book.Genre}</td>
                    <td>
                        <button class="edit-btn" onclick="prepareEdit('${book._id}', '${book.Title}', '${book.Author}', '${book.Price}', '${book.Genre}')">Edit</button>
                        <button class="delete-btn" onclick="deleteBook('${book._id}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Populate the form to get ready for an update
        function prepareEdit(id, title, author, price, genre) {
            document.getElementById('bookId').value = id;
            document.getElementById('Title').value = title;
            document.getElementById('Author').value = author;
            document.getElementById('Price').value = price;
            document.getElementById('Genre').value = genre;
            
            document.getElementById('submitBtn').value = 'Update Book';
            window.scrollTo(0, 0); // Scroll to top where the form is
        }

        // Delete a book
        async function deleteBook(id) {
            if(confirm("Are you sure you want to delete this book?")) {
                try {
                    await fetch(`http://localhost:3000/deleteBook/${id}`, {
                        method: 'DELETE'
                    });
                    fetchBooks(); // Refresh the table after deletion
                } catch (err) {
                    console.error("Error deleting book:", err);
                }
            }
        }
    </script>
</body>
</html>
